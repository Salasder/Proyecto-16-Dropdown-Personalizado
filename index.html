<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desplegable personalizado</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <main class="contenedor">
        <h1>Desplegable personalizado</h1>

        <div class="desplegable">
            <button class="boton-desplegable" id="botonDesplegable">
                <span id="textoSeleccionado">Selecciona un elemento</span>
                <span id="flecha">⌄</span>
            </button>

            <ul class="lista-opciones" id="listaOpciones">
                <li data-valor="Primer elemento">Primer elemento</li>
                <li data-valor="Segundo elemento">Segundo elemento</li>
                <li data-valor="Tercer elemento">Tercer elemento</li>
                <li data-valor="Cuarto elemento">Cuarto elemento</li>
                <li data-valor="Quinto elemento">Quinto elemento</li>
            </ul>
        </div>

    </main>

    <script src="javascript.js"></script>
</body>

</html>
